<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin | Dulce Fusion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ===== Estilos del Panel Admin ===== */
    :root {
      --admin-bg: #f3f4f6;
      --admin-card: #ffffff;
      --admin-primary: #b04a6e;
      --admin-primary-dark: #8e3b5a;
      --admin-border: #e5e7eb;
      --admin-text: #1f2937;
      --admin-text-muted: #6b7280;
      --admin-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      --admin-radius: 12px;
    }

    body.admin {
      background: var(--admin-bg);
      min-height: 100vh;
      padding: 20px;
    }

    .admin-container {
      max-width: 900px;
      margin: 0 auto;
    }

    .admin-header {
      background: var(--admin-card);
      border-radius: var(--admin-radius);
      padding: 24px;
      box-shadow: var(--admin-shadow);
      border: 1px solid var(--admin-border);
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .admin-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--admin-primary-dark);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .admin-actions {
      display: flex;
      gap: 10px;
    }

    .login-screen {
      max-width: 400px;
      margin: 80px auto;
      padding: 40px 30px;
      background: var(--admin-card);
      border-radius: var(--admin-radius);
      box-shadow: var(--admin-shadow);
      border: 1px solid var(--admin-border);
    }

    .login-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--admin-primary-dark);
      text-align: center;
      margin-bottom: 8px;
    }

    .login-subtitle {
      text-align: center;
      color: var(--admin-text-muted);
      margin-bottom: 24px;
      font-size: 0.9rem;
    }

    .products-grid-admin {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .product-admin-card {
      background: var(--admin-card);
      border-radius: var(--admin-radius);
      padding: 20px;
      box-shadow: var(--admin-shadow);
      border: 1px solid var(--admin-border);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .product-admin-image {
      width: 100%;
      height: 160px;
      border-radius: 10px;
      overflow: hidden;
      background: #f9fafb;
      border: 2px dashed var(--admin-border);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .product-admin-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .product-admin-image.placeholder {
      font-size: 3rem;
      color: var(--admin-text-muted);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--admin-text);
    }

    .form-input {
      padding: 10px 14px;
      border: 2px solid var(--admin-border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      background: #fff;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--admin-primary);
    }

    .form-input-url {
      font-family: monospace;
      font-size: 0.85rem;
    }

    .color-picker-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .color-picker {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: none;
    }

    .btn-admin {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn-admin-primary {
      background: var(--admin-primary);
      color: #fff;
    }

    .btn-admin-primary:hover {
      background: var(--admin-primary-dark);
    }

    .btn-admin-secondary {
      background: #f3f4f6;
      color: var(--admin-text);
    }

    .btn-admin-secondary:hover {
      background: #e5e7eb;
    }

    .btn-admin-danger {
      background: #fee2e2;
      color: #dc2626;
    }

    .btn-admin-danger:hover {
      background: #fecaca;
    }

    .btn-admin-block {
      width: 100%;
    }

    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
    }

    .alert-success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #6ee7b7;
    }

    .alert-error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .import-export-section {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid var(--admin-border);
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .back-link {
      margin-top: 20px;
      text-align: center;
    }

    .back-link a {
      color: var(--admin-primary);
      text-decoration: none;
      font-weight: 600;
    }

    .back-link a:hover {
      text-decoration: underline;
    }

    .product-id-badge {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--admin-text-muted);
      background: #f3f4f6;
      padding: 2px 8px;
      border-radius: 4px;
      align-self: flex-start;
    }

    .preview-text {
      font-size: 0.8rem;
      color: var(--admin-text-muted);
      margin-top: 4px;
    }

    @media (max-width: 640px) {
      .admin-container {
        padding: 0 16px;
      }
      .products-grid-admin {
        grid-template-columns: 1fr;
      }
      .admin-header {
        flex-direction: column;
        gap: 16px;
        align-items: flex-start;
      }
      .login-screen {
        margin: 40px 16px;
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body class="admin">

  <div class="admin-container">

    <!-- Pantalla de login -->
    <div class="login-screen" id="login-screen">
      <div class="login-title">🔐 Panel de Administración</div>
      <div class="login-subtitle">Dulce Fusion - Gestión de productos</div>
      <div class="form-group">
        <label class="form-label">Contraseña de acceso</label>
        <input type="password" id="admin-password" class="form-input" placeholder="Ingresa la contraseña">
      </div>
      <button class="btn btn-admin btn-admin-primary btn-admin-block" id="btn-login">Ingresar</button>
      <div id="login-error" class="alert alert-error" style="margin-top: 16px;">Contraseña incorrecta</div>
    </div>

    <!-- Panel de administración (oculto hasta login) -->
    <div id="admin-panel" style="display: none;">
      <div class="admin-header">
        <div class="admin-title">🍪 Gestión de Productos</div>
        <div class="admin-actions">
          <button class="btn btn-admin btn-admin-secondary" onclick="exportarConfiguracion()">📥 Exportar JSON</button>
          <input type="file" id="import-file" accept=".json" style="display: none;" onchange="importarConfiguracion(this)">
          <label for="import-file" class="btn btn-admin btn-admin-secondary">📤 Importar JSON</label>
          <button class="btn btn-admin btn-admin-danger" onclick="cerrarSesion()">Salir</button>
        </div>
      </div>

      <div id="admin-alert" class="alert alert-success"></div>

      <div class="products-grid-admin" id="admin-products-grid"></div>

      <div class="back-link">
        <a href="index.html">⬅ Volver a la tienda</a>
      </div>
    </div>

  </div>

  <script>
    // ===== Panel Admin =====
    (function () {
      'use strict';

      const CONTRASEÑA_ADMIN = 'dulcefusion2026'; // ← Cambia esta contraseña

      const loginScreen = document.getElementById('login-screen');
      const adminPanel = document.getElementById('admin-panel');
      const btnLogin = document.getElementById('btn-login');
      const inputPassword = document.getElementById('admin-password');
      const loginError = document.getElementById('login-error');
      const adminAlert = document.getElementById('admin-alert');
      const productsGrid = document.getElementById('admin-products-grid');

      // Verificar si ya hay sesión activa
      if (sessionStorage.getItem('dulcefusion_admin') === 'true') {
        mostrarPanel();
      }

      btnLogin.addEventListener('click', () => {
        if (inputPassword.value === CONTRASEÑA_ADMIN) {
          sessionStorage.setItem('dulcefusion_admin', 'true');
          loginError.style.display = 'none';
          mostrarPanel();
        } else {
          loginError.style.display = 'block';
          inputPassword.value = '';
        }
      });

      inputPassword.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') btnLogin.click();
      });

      function mostrarPanel() {
        loginScreen.style.display = 'none';
        adminPanel.style.display = 'block';
        renderProductosAdmin();
      }

      function cerrarSesion() {
        sessionStorage.removeItem('dulcefusion_admin');
        location.reload();
      }

      function renderProductosAdmin() {
        const productos = window.dulcefusion.productos;
        productsGrid.innerHTML = productos.map(p => `
          <div class="product-admin-card" data-id="${p.id}">
            <span class="product-id-badge">ID: ${p.id}</span>
            <div class="product-admin-image">
              ${p.imagen ? `<img src="${p.imagen}" alt="${p.nombre}" onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\\'placeholder\\'>🍪</span>';">` : '<span class="placeholder">🍪</span>'}
            </div>
            <div class="form-group">
              <label class="form-label">Nombre del producto</label>
              <input type="text" class="form-input" value="${p.nombre}" onchange="actualizarProducto(${p.id}, 'nombre', this.value)">
            </div>
            <div class="form-group">
              <label class="form-label">Sabor / Descripción</label>
              <input type="text" class="form-input" value="${p.sabor}" onchange="actualizarProducto(${p.id}, 'sabor', this.value)">
            </div>
            <div class="form-group">
              <label class="form-label">Precio (S/)</label>
              <input type="number" class="form-input" step="0.01" value="${p.precio}" onchange="actualizarProducto(${p.id}, 'precio', parseFloat(this.value))">
            </div>
            <div class="form-group">
              <label class="form-label">URL de la imagen</label>
              <input type="text" class="form-input form-input-url" placeholder="https://tu-imagen.com/foto.jpg" value="${p.imagen || ''}" onchange="actualizarProducto(${p.id}, 'imagen', this.value)">
              <div class="preview-text">Déjalo vacío para usar el diseño por defecto</div>
            </div>
            <div class="form-group color-picker-row">
              <label class="form-label">Color base</label>
              <input type="color" class="color-picker" value="${p.color}" onchange="actualizarProducto(${p.id}, 'color', this.value)">
            </div>
          </div>
        `).join('');
      }

      window.actualizarProducto = function (id, campo, valor) {
        const producto = window.dulcefusion.productos.find(p => p.id === id);
        if (producto) {
          producto[campo] = campo === 'precio' ? parseFloat(valor) : valor;
          window.dulcefusion.guardarConfiguracion();
          mostrarAlerta('Cambios guardados', 'success');
          // Recargar tienda si está abierta en otra pestaña
          window.dispatchEvent(new StorageEvent('storage', { key: 'dulcefusion_config', newValue: JSON.stringify(window.dulcefusion.productos) }));
        }
      };

      function mostrarAlerta(msg, tipo) {
        adminAlert.textContent = msg;
        adminAlert.className = `alert alert-${tipo}`;
        adminAlert.style.display = 'block';
        setTimeout(() => { adminAlert.style.display = 'none'; }, 3000);
      }

      window.exportarConfiguracion = function () {
        const config = JSON.stringify(window.dulcefusion.productos, null, 2);
        const blob = new Blob([config], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'dulcefusion-config.json';
        a.click();
        URL.revokeObjectURL(url);
        mostrarAlerta('Configuración exportada', 'success');
      };

      window.importarConfiguracion = function (input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const config = JSON.parse(e.target.result);
            window.dulcefusion.productos = config;
            window.dulcefusion.guardarConfiguracion();
            renderProductosAdmin();
            mostrarAlerta('Configuración importada correctamente', 'success');
          } catch (err) {
            mostrarAlerta('Error al importar el archivo JSON', 'error');
          }
        };
        reader.readAsText(file);
        input.value = '';
      };
    })();
  </script>
</body>
</html>
